<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎯 2주 챌린지</title>
<link href="https://fonts.googleapis.com/css2?family=Gmarket+Sans:wght@300;500;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --purple:#7c3aed;--purple2:#a855f7;--purple-pale:#f0edff;--purple-mid:#ede9fe;
  --green:#16a34a;--green-pale:#dcfce7;
  --amber:#b45309;--amber-pale:#fffbeb;--amber-border:#fde68a;
  --red:#991b1b;--red-pale:#fee2e2;
  --gray:#6b7280;--gray-mid:#e5e7eb;
  --dark:#1e1b2e;
  --bg:#f7f5ff;--surface:#fff;--surface2:#f0edff;--border:#e2ddf5;
  --radius:16px;--radius-sm:10px;
}
html,body{min-height:100vh;background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--dark)}
.header{background:var(--purple);color:white;padding:20px 16px 0;position:sticky;top:0;z-index:100}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back-btn{background:rgba(255,255,255,.2);border:none;color:white;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.header-title{font-family:'Gmarket Sans';font-size:1.2rem;font-weight:700;flex:1}
.tabs{display:flex;background:rgba(255,255,255,.1)}
.tab{flex:1;padding:11px 4px;text-align:center;font-size:.78rem;font-weight:600;color:rgba(255,255,255,.6);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.tab.active{color:white;border-bottom-color:white;background:rgba(255,255,255,.15)}
.content{padding:14px;padding-bottom:40px}
.challenge-banner{background:linear-gradient(135deg,var(--purple),var(--purple2));border-radius:var(--radius);padding:18px;color:white;margin-bottom:14px}
.banner-title{font-family:'Gmarket Sans';font-size:1.05rem;font-weight:700;margin-bottom:4px}
.banner-sub{font-size:.76rem;opacity:.85;margin-bottom:14px}
.banner-pct-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.banner-pct{font-family:'Gmarket Sans';font-size:1.4rem;font-weight:700;min-width:50px}
.banner-prog-outer{flex:1;height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.banner-prog-inner{height:100%;border-radius:99px;background:white;transition:width .6s ease}
.banner-goal{font-size:.72rem;opacity:.8;margin-bottom:10px}
.dot-week-label{font-size:.68rem;opacity:.7;margin-bottom:4px}
.dot-row{display:flex;gap:3px;margin-bottom:6px}
.dot{flex:1;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700}
.dot-done{background:rgba(255,255,255,.9);color:var(--purple)}
.dot-today{background:white;color:var(--purple);outline:2px solid rgba(255,255,255,.5)}
.dot-empty{background:rgba(255,255,255,.15);color:rgba(255,255,255,.5)}
.dot-weekend{background:rgba(255,255,255,.08);color:rgba(255,255,255,.3)}
.dot-miss{background:rgba(239,68,68,.45);color:white}
.reward-card{background:var(--amber-pale);border:1.5px solid var(--amber-border);border-radius:var(--radius);padding:13px 15px;margin-bottom:14px}
.reward-title{font-size:.78rem;font-weight:700;color:#92400e;margin-bottom:8px}
.reward-row{display:flex;align-items:center;justify-content:space-between;background:white;border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:6px}
.reward-row:last-child{margin-bottom:0}
.reward-cond{font-size:.8rem;color:#374151}
.reward-val{font-size:.82rem;font-weight:700;color:var(--amber)}
.subject-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:10px;box-shadow:0 1px 4px rgba(124,58,237,.06)}
.subject-card.cert-done{border-color:#86efac;background:#f0fdf4}
.subject-header{padding:10px 14px;background:var(--surface2);display:flex;align-items:center;justify-content:space-between}
.subject-name{font-weight:700;font-size:.9rem}
.subject-status{font-size:.72rem;font-weight:600;color:var(--gray)}
.subject-status.running{color:#10b981}
.subject-status.done{color:var(--green)}
.subject-cert-row{padding:10px 14px;display:flex;align-items:center;gap:8px}
.cert-btn{flex:1;padding:10px 4px;border:none;border-radius:var(--radius-sm);font-family:'Noto Sans KR';font-size:.72rem;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .1s}
.cert-btn:active{transform:scale(.96)}
.cert-btn:disabled{opacity:.3;cursor:not-allowed}
.cert-btn.start{background:var(--green-pale);color:#166534}
.cert-btn.end{background:var(--red-pale);color:var(--red)}
.cert-btn.done-state{background:var(--purple-mid);color:var(--purple)}
.cert-btn-icon{font-size:1.3rem}
.cert-btn-lbl{font-size:.6rem}
.timer-box{background:var(--dark);color:#a855f7;border-radius:var(--radius-sm);padding:8px 8px;font-family:'Gmarket Sans';font-size:1rem;font-weight:700;text-align:center;letter-spacing:.06em;min-width:68px;flex-shrink:0}
.timer-box.running{color:#a3e635}
.cert-photos{display:flex;gap:8px;padding:0 14px 12px}
.cert-photo-slot{flex:1}
.cert-photo-inner{width:100%;aspect-ratio:1;background:var(--surface2);border-radius:var(--radius-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:1.5rem;border:1.5px dashed var(--border);overflow:hidden}
.cert-photo-inner.has-photo{border-style:solid;border-color:#a78bfa}
.cert-photo-inner img{width:100%;height:100%;object-fit:cover}
.cert-photo-label{font-size:.65rem;color:var(--gray);text-align:center;margin-top:4px;font-weight:600}
.cert-photo-label.done{color:var(--green)}
.modal-backdrop{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);align-items:flex-end;justify-content:center}
.modal-backdrop.open{display:flex}
.modal{background:var(--surface);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:0 0 env(safe-area-inset-bottom,16px);max-height:85vh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.4,0,.2,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:99px;margin:12px auto 0}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 12px;border-bottom:1px solid var(--border)}
.modal-title{font-family:'Gmarket Sans';font-size:1rem;font-weight:700}
.modal-close{width:30px;height:30px;border-radius:50%;border:none;background:var(--surface2);color:var(--gray);cursor:pointer;font-size:.95rem}
.modal-body{padding:16px;display:flex;flex-direction:column;gap:14px}
.photo-zone{border:2px dashed var(--purple-mid);background:var(--purple-pale);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer}
.photo-preview{margin-top:10px;display:none}
.photo-preview img{width:100%;border-radius:var(--radius-sm);object-fit:cover;max-height:200px}
.save-btn{width:100%;padding:14px;border:none;border-radius:var(--radius);background:linear-gradient(135deg,var(--purple),var(--purple2));color:white;font-family:'Gmarket Sans';font-size:.98rem;font-weight:700;cursor:pointer}
.save-btn:disabled{opacity:.4;cursor:not-allowed}
.parent-cert-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:10px}
.parent-cert-card.approved-card{border-color:#86efac}
.pcc-header{padding:10px 14px;background:var(--surface2);display:flex;align-items:center;justify-content:space-between}
.pcc-name{font-weight:700;font-size:.9rem}
.pcc-time{font-size:.72rem;color:var(--gray)}
.pcc-photos{display:flex;gap:8px;padding:12px 14px 6px}
.pcc-photo{flex:1}
.pcc-photo-box{width:100%;aspect-ratio:1;border-radius:var(--radius-sm);overflow:hidden;background:var(--gray-mid);display:flex;align-items:center;justify-content:center;font-size:2rem}
.pcc-photo-box img{width:100%;height:100%;object-fit:cover}
.pcc-photo-label{font-size:.65rem;color:var(--gray);text-align:center;margin-top:4px;font-weight:600}
.pcc-timer{background:var(--dark);color:#a855f7;border-radius:var(--radius-sm);padding:6px 12px;font-family:'Gmarket Sans';font-size:.85rem;font-weight:700;text-align:center;margin:0 14px 10px}
.pcc-btns{display:flex;gap:8px;padding:0 14px 12px}
.pcc-btn{flex:1;padding:9px;border:none;border-radius:var(--radius-sm);font-family:'Noto Sans KR';font-size:.8rem;font-weight:700;cursor:pointer}
.pcc-btn.approve{background:var(--green-pale);color:#166534}
.pcc-btn.retry{background:var(--red-pale);color:var(--red)}
.pcc-btn.approved{background:var(--purple-mid);color:var(--purple);cursor:default}
.result-hero{background:linear-gradient(135deg,var(--purple),var(--purple2));border-radius:var(--radius);padding:22px;color:white;text-align:center;margin-bottom:14px}
.result-emoji{font-size:3rem;margin-bottom:8px}
.result-title{font-family:'Gmarket Sans';font-size:1.2rem;font-weight:700;margin-bottom:4px}
.result-sub{font-size:.8rem;opacity:.82;margin-bottom:16px}
.result-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.rs-stat{background:rgba(255,255,255,.15);border-radius:10px;padding:10px 6px;text-align:center}
.rs-stat-num{font-family:'Gmarket Sans';font-size:1.2rem;font-weight:700}
.rs-stat-label{font-size:.62rem;opacity:.8;margin-top:3px}
.result-reward-box{background:white;border-radius:10px;padding:13px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Gmarket Sans';font-size:.95rem;font-weight:700;color:var(--purple)}
.result-reward-box.lose{color:var(--red);background:#fee2e2}
.settings-section{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.settings-header{padding:12px 14px;background:var(--surface2);font-family:'Gmarket Sans';font-size:.88rem;font-weight:700}
.settings-body{padding:14px;display:flex;flex-direction:column;gap:10px}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.settings-label{font-size:.84rem;color:var(--dark);font-weight:500;flex-shrink:0}
.settings-input{border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;font-size:.84rem;outline:none;background:white;width:100%;max-width:200px}
.settings-input:focus{border-color:var(--purple)}
.settings-save-btn{width:100%;padding:12px;border:none;border-radius:var(--radius-sm);background:var(--purple);color:white;font-family:'Gmarket Sans';font-size:.9rem;font-weight:700;cursor:pointer;margin-top:4px}
.section-title{font-family:'Gmarket Sans';font-size:.8rem;font-weight:700;color:var(--gray);letter-spacing:.05em;margin-bottom:8px}
.empty{padding:40px;text-align:center;color:var(--gray);font-size:.88rem}
.empty-icon{font-size:2.5rem;margin-bottom:8px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--dark);color:white;border-radius:20px;padding:9px 18px;font-size:.83rem;font-weight:500;z-index:9999;opacity:0;transition:all .25s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.img-viewer{display:none;position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.9);align-items:center;justify-content:center}
.img-viewer.open{display:flex}
.img-viewer img{max-width:95vw;max-height:90vh;border-radius:10px;object-fit:contain}
.img-viewer-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.15);border:none;color:white;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center}
.loading{padding:40px;text-align:center;color:var(--gray)}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <button class="back-btn" onclick="location.href=location.search.includes('parent')?'index.html?parent':'index.html'">←</button>
    <div class="header-title">🎯 2주 챌린지</div>
  </div>
  <div class="tabs">
    <div class="tab active" id="tab-child" onclick="switchTab('child')">👧 아이</div>
    <div class="tab" id="tab-parent" onclick="switchTab('parent')" style="display:none">👨‍👩‍👧 부모</div>
    <div class="tab" id="tab-result" onclick="switchTab('result')">🏆 결과</div>
    <div class="tab" id="tab-settings" onclick="switchTab('settings')">⚙️ 설정</div>
  </div>
</div>

<div id="screen-child" class="content">
  <div id="loading-child" class="loading"><div class="spinner"></div>과목 불러오는 중...</div>
  <div id="child-content" style="display:none">
    <div class="challenge-banner">
      <div class="banner-title">🎯 2주 챌린지 진행중!</div>
      <div class="banner-sub" id="banner-period">설정에서 시작일을 설정해주세요</div>
      <div class="banner-pct-row">
        <div class="banner-pct" id="banner-pct">0%</div>
        <div class="banner-prog-outer"><div class="banner-prog-inner" id="banner-prog" style="width:0%"></div></div>
      </div>
      <div class="banner-goal" id="banner-goal-text">목표: 85% 이상 → 보상!</div>
      <div class="dot-week-label">1주차</div>
      <div class="dot-row" id="dots-week1"></div>
      <div class="dot-week-label">2주차</div>
      <div class="dot-row" id="dots-week2"></div>
    </div>
    <div class="reward-card">
      <div class="reward-title">🎁 이번 챌린지 보상</div>
      <div class="reward-row"><span class="reward-cond">100% 달성</span><span class="reward-val" id="r100d">⚙️ 설정 필요</span></div>
      <div class="reward-row"><span class="reward-cond">85% 이상</span><span class="reward-val" id="r85d">⚙️ 설정 필요</span></div>
      <div class="reward-row" style="background:#fee2e2"><span class="reward-cond" style="color:#991b1b">85% 미만</span><span class="reward-val" style="color:#991b1b">❌ 보상 없음</span></div>
    </div>
    <div class="section-title">📚 오늘 인증하기</div>
    <div id="subject-cert-list"></div>
  </div>
</div>

<div id="screen-parent" class="content" style="display:none">
  <div id="parent-cert-list"></div>
</div>

<div id="screen-result" class="content" style="display:none">
  <div id="result-content"></div>
</div>

<div id="screen-settings" class="content" style="display:none">
  <div class="settings-section">
    <div class="settings-header">📅 챌린지 기간</div>
    <div class="settings-body">
      <div class="settings-row">
        <span class="settings-label">시작일</span>
        <input type="date" class="settings-input" id="start-date" onchange="onStartChange()">
      </div>
      <div class="settings-row">
        <span class="settings-label">종료일</span>
        <input class="settings-input" id="end-date-disp" readonly style="background:var(--surface2);color:var(--gray)" placeholder="자동 계산">
      </div>
    </div>
  </div>
  <div class="settings-section">
    <div class="settings-header">🎁 보상 설정</div>
    <div class="settings-body">
      <div class="settings-row">
        <span class="settings-label">100% 달성</span>
        <input type="text" class="settings-input" id="reward-100" placeholder="예: 치킨 + 영화" maxlength="20">
      </div>
      <div class="settings-row">
        <span class="settings-label">85% 이상</span>
        <input type="text" class="settings-input" id="reward-85" placeholder="예: 치킨" maxlength="20">
      </div>
      <button class="settings-save-btn" onclick="saveSettings()">💾 저장하기</button>
    </div>
  </div>
  <div class="settings-section">
    <div class="settings-header">📚 연동된 과목 (기존 앱 자동 연동)</div>
    <div class="settings-body" id="linked-subjects-list" style="font-size:.84rem;color:var(--gray)">불러오는 중...</div>
  </div>
</div>

<div class="modal-backdrop" id="photo-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="modal-title">인증하기</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div style="font-size:.82rem;color:var(--gray);margin-bottom:4px" id="modal-sub"></div>
      <div class="photo-zone" onclick="document.getElementById('photo-input').click()">
        <input type="file" id="photo-input" accept="image/*" capture="environment" onchange="handlePhoto(this)" style="display:none">
        <div style="font-size:2rem;margin-bottom:6px">📷</div>
        <div style="color:var(--purple);font-weight:700;font-size:.9rem">탭해서 사진 찍기</div>
        <div style="color:var(--gray);font-size:.74rem;margin-top:3px">카메라 또는 갤러리</div>
      </div>
      <div class="photo-preview" id="photo-preview">
        <img id="photo-preview-img" src="" alt="">
      </div>
      <button class="save-btn" id="modal-save-btn" onclick="confirmPhoto()" disabled>인증 완료 ✅</button>
    </div>
  </div>
</div>

<div class="img-viewer" id="img-viewer" onclick="closeImgViewer()">
  <button class="img-viewer-close" onclick="closeImgViewer()">✕</button>
  <img id="img-viewer-img" src="" alt="">
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyD8qlxN9Bv5VQUAc33ak-iMY20A9Hm1Jyc",
  authDomain: "my-routine-6c65a.firebaseapp.com",
  projectId: "my-routine-6c65a",
  storageBucket: "my-routine-6c65a.firebasestorage.app",
  messagingSenderId: "919928475674",
  appId: "1:919928475674:web:7105269ecc5e192f4181a3"
};
if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
var db = firebase.firestore();

var subjects = [];
var challengeData = {};
var currentTab = 'child';
var photoModal = {subjIdx:null, type:null, photoData:null};
var timers = {};
var unsub = null;

function isWE(d){ var x=(d||new Date()).getDay(); return x===0||x===6; }
function dKey(d){ var dt=d||new Date(); return dt.getFullYear()+'-'+(dt.getMonth()+1)+'-'+dt.getDate(); }
function fmtT(s){ var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60; return (h>0?p2(h)+':':'')+p2(m)+':'+p2(sc); }
function p2(n){ return String(n).padStart(2,'0'); }

document.addEventListener('DOMContentLoaded', function(){
  var isParent = location.search.includes('parent');
  if(isParent){
    document.getElementById('tab-parent').style.display = '';
    // 아이 탭 숨기기 (부모 화면에서는 아이 탭 불필요)
    document.getElementById('tab-child').style.display = 'none';
    switchTab('parent');
  }
  db.collection('settings').doc('subjects').get()
    .then(function(snap){
      if(snap.exists) subjects = snap.data().weekday || [];
    })
    .catch(function(){})
    .finally(function(){ startListen(); });
});

function startListen(){
  if(unsub) unsub();
  unsub = db.collection('challenge').doc('main').onSnapshot(function(snap){
    if(snap.exists){
      challengeData = snap.data();
      if(!challengeData.certData) challengeData.certData = {};
    } else {
      var t=new Date(), e=new Date(t); e.setDate(t.getDate()+13);
      challengeData = {startDate:dKey(t),endDate:dKey(e),reward100:'',reward85:'',certData:{}};
      db.collection('challenge').doc('main').set(challengeData);
    }
    document.getElementById('loading-child').style.display='none';
    document.getElementById('child-content').style.display='block';
    renderCurrent();
  }, function(err){
    console.log(err);
    challengeData={certData:{}};
    document.getElementById('loading-child').style.display='none';
    document.getElementById('child-content').style.display='block';
    renderCurrent();
  });
}

function save(){ db.collection('challenge').doc('main').set(challengeData,{merge:true}); }

function switchTab(t){
  currentTab=t;
  ['child','parent','result','settings'].forEach(function(x){
    document.getElementById('screen-'+x).style.display=x===t?'block':'none';
    var tabEl = document.getElementById('tab-'+x);
    if(tabEl) tabEl.classList.toggle('active',x===t);
  });
  renderCurrent();
}

function renderCurrent(){
  if(currentTab==='child') renderChild();
  else if(currentTab==='parent') renderParent();
  else if(currentTab==='result') renderResult();
  else if(currentTab==='settings') renderSettings();
}

function get14Dates(){
  if(!challengeData.startDate) return [];
  var p=challengeData.startDate.split('-');
  var s=new Date(+p[0],+p[1]-1,+p[2]), arr=[];
  for(var i=0;i<14;i++){ var d=new Date(s); d.setDate(s.getDate()+i); arr.push(d); }
  return arr;
}

function calcProg(){
  var dates=get14Dates(), today=new Date(); today.setHours(0,0,0,0);
  var total=0,done=0;
  dates.forEach(function(d){
    if(d>today) return;
    var k=dKey(d);
    subjects.forEach(function(_,i){
      total++;
      var c=(challengeData.certData||{})[k+'_'+i];
      if(c&&c.startPhoto&&c.endPhoto) done++;
    });
  });
  return {total:total,done:done,pct:total>0?Math.round(done/total*100):0};
}

function renderChild(){
  var prog=calcProg();
  document.getElementById('banner-pct').textContent=prog.pct+'%';
  document.getElementById('banner-prog').style.width=prog.pct+'%';
  document.getElementById('r100d').textContent=challengeData.reward100||'⚙️ 설정 필요';
  document.getElementById('r85d').textContent=challengeData.reward85||'⚙️ 설정 필요';
  if(challengeData.startDate&&challengeData.endDate)
    document.getElementById('banner-period').textContent=challengeData.startDate+' ~ '+challengeData.endDate;
  if(challengeData.reward85)
    document.getElementById('banner-goal-text').textContent='목표: 85% 이상 → '+challengeData.reward85+'!';

  var dates=get14Dates(), today=new Date(); today.setHours(0,0,0,0);
  document.getElementById('dots-week1').innerHTML='';
  document.getElementById('dots-week2').innerHTML='';
  var DAYS=['일','월','화','수','목','금','토'];
  dates.forEach(function(d,i){
    var el=document.createElement('div');
    el.textContent=DAYS[d.getDay()];
    var k=dKey(d),isFut=d>today,isToday=d.getTime()===today.getTime(),isW=isWE(d);
    if(isFut) el.className='dot '+(isW?'dot-weekend':'dot-empty');
    else if(isToday) el.className='dot dot-today';
    else {
      var allDone=subjects.length>0&&subjects.every(function(_,si){
        var c=(challengeData.certData||{})[k+'_'+si]; return c&&c.startPhoto&&c.endPhoto;
      });
      el.className='dot '+(allDone?'dot-done':(isW?'dot-weekend':'dot-miss'));
    }
    document.getElementById(i<7?'dots-week1':'dots-week2').appendChild(el);
  });

  var list=document.getElementById('subject-cert-list');
  list.innerHTML='';
  if(!subjects.length){
    list.innerHTML='<div class="empty"><div class="empty-icon">📚</div>기존 앱에서 과목을 설정해주세요</div>';
    return;
  }
  var k=dKey();
  subjects.forEach(function(s,i){
    var cert=(challengeData.certData||{})[k+'_'+i]||{};
    var hasS=!!cert.startPhoto, hasBoth=hasS&&!!cert.endPhoto, running=hasS&&!hasBoth;
    var elapsed=cert.elapsedSec||0;
    var card=document.createElement('div');
    card.className='subject-card'+(hasBoth?' cert-done':'');
    var statusHtml=hasBoth?'<span class="subject-status done">인증 완료 ⭐</span>':running?'<span class="subject-status running">진행중 ⏱️</span>':'<span class="subject-status">미인증</span>';
    var bodyHtml='';
    if(hasBoth){
      bodyHtml='<div class="cert-photos">'+
        '<div class="cert-photo-slot"><div class="cert-photo-inner has-photo"><img src="'+cert.startPhoto+'" onclick="openImg(this.src)"></div><div class="cert-photo-label done">시작 📸</div></div>'+
        '<div style="display:flex;align-items:center;color:var(--gray);padding-bottom:22px;font-size:.9rem">→</div>'+
        '<div class="cert-photo-slot"><div class="cert-photo-inner has-photo"><img src="'+cert.endPhoto+'" onclick="openImg(this.src)"></div><div class="cert-photo-label done">완료 ✅</div></div>'+
        '</div>';
    } else {
      bodyHtml='<div class="subject-cert-row">'+
        '<button class="cert-btn '+(hasS?'done-state':'start')+'" '+(hasS?'disabled':'')+' onclick="openPM('+i+',\'start\')">'+
          '<span class="cert-btn-icon">'+(hasS?'✅':'📸')+'</span><span class="cert-btn-lbl">'+(hasS?'시작완료':'시작 인증')+'</span></button>'+
        '<div class="timer-box '+(running?'running':'')+'" id="timer-'+i+'">'+fmtT(elapsed)+'</div>'+
        '<button class="cert-btn end" '+(hasS?'':'disabled')+' onclick="openPM('+i+',\'end\')">'+
          '<span class="cert-btn-icon">📸</span><span class="cert-btn-lbl">완료 인증</span></button>'+
        '</div>';
    }
    card.innerHTML='<div class="subject-header"><span class="subject-name">'+s+'</span>'+statusHtml+'</div>'+bodyHtml;
    list.appendChild(card);
    if(running) startTick(i,elapsed);
  });
}

function startTick(idx,sec){
  if(timers[idx]) clearInterval(timers[idx]);
  var s=sec||0;
  timers[idx]=setInterval(function(){
    s++;
    var el=document.getElementById('timer-'+idx);
    if(el) el.textContent=fmtT(s);
    var k=dKey(), ck=k+'_'+idx;
    if(!challengeData.certData[ck]) challengeData.certData[ck]={};
    challengeData.certData[ck].elapsedSec=s;
  },1000);
}
function stopTick(idx){ if(timers[idx]){clearInterval(timers[idx]);delete timers[idx];} }

function openPM(idx,type){
  photoModal={subjIdx:idx,type:type,photoData:null};
  document.getElementById('modal-title').textContent=subjects[idx];
  document.getElementById('modal-sub').textContent=type==='start'?'📸 공부 시작 전 사진을 찍어주세요!':'✅ 공부 완료 후 사진을 찍어주세요!';
  document.getElementById('photo-preview').style.display='none';
  document.getElementById('photo-input').value='';
  document.getElementById('modal-save-btn').disabled=true;
  document.getElementById('photo-modal').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){ document.getElementById('photo-modal').classList.remove('open'); document.body.style.overflow=''; }
document.getElementById('photo-modal').addEventListener('click',function(e){if(e.target===this)closeModal();});

function handlePhoto(input){
  var file=input.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    photoModal.photoData=e.target.result;
    document.getElementById('photo-preview-img').src=e.target.result;
    document.getElementById('photo-preview').style.display='block';
    document.getElementById('modal-save-btn').disabled=false;
  };
  reader.readAsDataURL(file);
}

function confirmPhoto(){
  if(!photoModal.photoData){showToast('사진을 먼저 찍어주세요 📷');return;}
  var k=dKey(), ck=k+'_'+photoModal.subjIdx;
  if(!challengeData.certData) challengeData.certData={};
  if(!challengeData.certData[ck]) challengeData.certData[ck]={};
  if(photoModal.type==='start'){
    challengeData.certData[ck].startPhoto=photoModal.photoData;
    challengeData.certData[ck].startTime=new Date().toISOString();
    challengeData.certData[ck].elapsedSec=0;
    startTick(photoModal.subjIdx,0);
    showToast('시작 인증 완료! 타이머 시작 ⏱️');
  } else {
    challengeData.certData[ck].endPhoto=photoModal.photoData;
    challengeData.certData[ck].endTime=new Date().toISOString();
    stopTick(photoModal.subjIdx);
    showToast('완료 인증! 오늘도 최고야 ⭐');
  }
  save(); closeModal(); renderChild();
}

function renderParent(){
  var list=document.getElementById('parent-cert-list');
  list.innerHTML='';
  var k=dKey(), hasAny=false;
  subjects.forEach(function(s,i){
    var cert=(challengeData.certData||{})[k+'_'+i];
    if(!cert||(!cert.startPhoto&&!cert.endPhoto)) return;
    hasAny=true;
    var elapsed=cert.elapsedSec||0, mins=Math.floor(elapsed/60);
    var card=document.createElement('div');
    card.className='parent-cert-card'+(cert.approved?' approved-card':'');
    var btns=cert.approved
      ?'<button class="pcc-btn approved">✅ 승인 완료</button>'
      :'<button class="pcc-btn approve" onclick="approveS(\''+k+'_'+i+'\')">👍 승인</button><button class="pcc-btn retry" onclick="retryS(\''+k+'_'+i+'\')">🔄 다시 인증</button>';
    card.innerHTML=
      '<div class="pcc-header"><span class="pcc-name">'+s+'</span><span class="pcc-time">'+(elapsed>0?mins+'분 공부':'인증됨')+'</span></div>'+
      '<div class="pcc-photos">'+
        '<div class="pcc-photo"><div class="pcc-photo-box">'+(cert.startPhoto?'<img src="'+cert.startPhoto+'" onclick="openImg(this.src)">':'📚')+'</div><div class="pcc-photo-label">시작 사진</div></div>'+
        '<div class="pcc-photo"><div class="pcc-photo-box">'+(cert.endPhoto?'<img src="'+cert.endPhoto+'" onclick="openImg(this.src)">':'⏳')+'</div><div class="pcc-photo-label">완료 사진</div></div>'+
      '</div>'+
      (elapsed>0?'<div class="pcc-timer">총 '+fmtT(elapsed)+'</div>':'')+
      '<div class="pcc-btns">'+btns+'</div>';
    list.appendChild(card);
  });
  if(!hasAny) list.innerHTML='<div class="empty"><div class="empty-icon">📭</div>오늘 아직 인증된 과목이 없어요</div>';
}

function approveS(ck){
  if(!challengeData.certData[ck]) challengeData.certData[ck]={};
  challengeData.certData[ck].approved=true;
  save(); showToast('👍 승인했어요!'); renderParent();
}
function retryS(ck){
  delete challengeData.certData[ck];
  save(); showToast('🔄 다시 인증 요청'); renderParent();
}

function renderResult(){
  var prog=calcProg(), dates=get14Dates();
  var totalSec=0, clearDays=0;
  dates.forEach(function(d){
    var k=dKey(d);
    var allDone=subjects.length>0&&subjects.every(function(_,i){var c=(challengeData.certData||{})[k+'_'+i];return c&&c.startPhoto&&c.endPhoto;});
    if(allDone) clearDays++;
    subjects.forEach(function(_,i){var c=(challengeData.certData||{})[k+'_'+i];if(c&&c.elapsedSec)totalSec+=c.elapsedSec;});
  });
  var hours=(totalSec/3600).toFixed(1);
  var rHtml,rClass='';
  if(prog.pct>=100){rHtml='🏆 '+(challengeData.reward100||'최고 보상!');}
  else if(prog.pct>=85){rHtml='🍗 '+(challengeData.reward85||'보상!');}
  else{rHtml='❌ 보상 없음 (85% 미만)';rClass='lose';}
  document.getElementById('result-content').innerHTML=
    '<div class="result-hero"><div class="result-emoji">📊</div><div class="result-title">챌린지 현황</div>'+
    '<div class="result-sub">'+prog.done+' / '+prog.total+' 과목 완료</div>'+
    '<div class="result-stats">'+
      '<div class="rs-stat"><div class="rs-stat-num">'+prog.pct+'%</div><div class="rs-stat-label">달성률</div></div>'+
      '<div class="rs-stat"><div class="rs-stat-num">'+clearDays+'일</div><div class="rs-stat-label">완벽한 날 ⭐</div></div>'+
      '<div class="rs-stat"><div class="rs-stat-num">'+hours+'h</div><div class="rs-stat-label">총 공부시간</div></div>'+
    '</div>'+
    '<div class="result-reward-box '+rClass+'">'+rHtml+'</div></div>';
}

function renderSettings(){
  if(challengeData.startDate){
    document.getElementById('start-date').value=challengeData.startDate;
    calcEndDate(challengeData.startDate);
  }
  document.getElementById('reward-100').value=challengeData.reward100||'';
  document.getElementById('reward-85').value=challengeData.reward85||'';
  var el=document.getElementById('linked-subjects-list');
  if(subjects.length){
    el.innerHTML=subjects.map(function(s){return '<div style="padding:5px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px"><span style="color:var(--purple)">●</span>'+s+'</div>';}).join('')+
      '<div style="font-size:.74rem;color:var(--gray);margin-top:8px">※ 과목 변경은 기존 앱 설정에서 해주세요</div>';
  } else {
    el.textContent='기존 앱에서 과목을 설정해주세요';
  }
}

function onStartChange(){ calcEndDate(document.getElementById('start-date').value); }
function calcEndDate(s){
  if(!s) return;
  var p=s.split('-'), e=new Date(+p[0],+p[1]-1,+p[2]); e.setDate(e.getDate()+13);
  document.getElementById('end-date-disp').value=e.getFullYear()+'-'+(e.getMonth()+1)+'-'+e.getDate();
}

function saveSettings(){
  var s=document.getElementById('start-date').value;
  if(!s){showToast('시작일을 선택해주세요');return;}
  var p=s.split('-'), e=new Date(+p[0],+p[1]-1,+p[2]); e.setDate(e.getDate()+13);
  challengeData.startDate=s;
  challengeData.endDate=e.getFullYear()+'-'+(e.getMonth()+1)+'-'+e.getDate();
  challengeData.reward100=document.getElementById('reward-100').value;
  challengeData.reward85=document.getElementById('reward-85').value;
  save(); showToast('✅ 저장됐어요!'); switchTab('child');
}

function openImg(src){document.getElementById('img-viewer-img').src=src;document.getElementById('img-viewer').classList.add('open');}
function closeImgViewer(){document.getElementById('img-viewer').classList.remove('open');}
var toastT;
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2300);}
</script>
</body>
</html>
